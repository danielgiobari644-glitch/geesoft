<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Management Console</title>
<link rel="icon" href="./favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- LOGIN -->
<div class="auth" id="authView">
  <form class="auth__card" id="loginForm" novalidate>
    <img src="./favicon.png" alt="" class="auth__logo" width="52" height="52" />
    <h1 class="auth__title">Management Console</h1>
    <p class="auth__sub">Authorised access only. Sign in with your account.</p>
    <div class="f">
      <label for="li-email">Email</label>
      <input id="li-email" type="email" autocomplete="username" required />
    </div>
    <div class="f">
      <label for="li-pass">Password</label>
      <input id="li-pass" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn btn--primary btn--full" type="submit" id="loginBtn">Sign in</button>
    <button class="linkbtn" type="button" id="resetBtn">Send password reset email</button>
    <p class="msg" id="authMsg" role="status" aria-live="polite"></p>
  </form>
</div>

<!-- DASHBOARD -->
<div class="app" id="appView" hidden>
  <aside class="side" id="side">
    <div class="side__brand">
      <img src="./favicon.png" alt="" width="34" height="34" />
      <div><strong>GeeSoft</strong><span>Console</span></div>
    </div>
    <nav class="side__nav" id="sideNav" aria-label="Dashboard sections">
      <button class="tab is-active" data-view="overview">Overview</button>
      <button class="tab" data-view="hero">Hero</button>
      <button class="tab" data-view="intro">Introduction</button>
      <button class="tab" data-view="skills">Skills</button>
      <button class="tab" data-view="projects">Projects</button>
      <button class="tab" data-view="contact">Contact</button>
      <button class="tab" data-view="settings">Site Settings</button>
      <button class="tab" data-view="account">Account &amp; Security</button>
    </nav>
    <div class="side__foot">
      <span id="whoami" class="who"></span>
      <button class="btn btn--ghost btn--sm btn--full" id="signOutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="iconbtn" id="sideToggle" aria-label="Toggle navigation">☰</button>
      <h2 id="viewTitle">Overview</h2>
      <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">View site</a>
    </header>
    <div class="views" id="views"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="color:#ff9b9b;text-align:center;padding:2rem">JavaScript is required for the management console.</p></noscript>
<script type="module" src="admin.js"></script>
<script>
// If the module fails to load (blocked CDN / offline), tell the admin instead of showing a dead form.
window.addEventListener("error", function (e) {
  if (e.target && e.target.tagName === "SCRIPT") {
    var m = document.getElementById("authMsg");
    if (m) { m.className = "msg err"; m.textContent = "Could not load Firebase. Check your internet connection."; }
  }
}, true);
setTimeout(function () {
  if (!window.__geesoftAdminReady) {
    var m = document.getElementById("authMsg");
    if (m && !m.textContent) { m.className = "msg err"; m.textContent = "Could not reach Firebase. Check your connection, then reload."; }
  }
}, 9000);
</script>
</body>
</html>
